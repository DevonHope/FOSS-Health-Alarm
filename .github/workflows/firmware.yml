name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Smart-wake, activity, alarm and protocol tests
        run: make -C firmware/tests/host

  build:
    name: Zephyr build (nudgeband/nrf54l10/cpuapp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: nudgeband
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up Zephyr, its modules and the ARM toolchain
        uses: zephyrproject-rtos/action-zephyr-setup@cc223fe61661d8573c1cd3f95f72f90cce729ae9 # v1.0.16
        with:
          # west makes the folder above app-path the workspace, so point it at the repo root
          app-path: nudgeband
          manifest-file-name: firmware/west.yml
          toolchains: arm-zephyr-eabi
          sdk-version: 0.17.2
      # Zephyr v4.2's CMake scripts fail under CMake 4.x (the runner's default)
      - name: Use CMake 3.x
        run: |
          pip install "cmake>=3.20,<4"
          cmake --version
      - name: Build
        run: west build -b nudgeband/nrf54l10/cpuapp nudgeband/firmware -d build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nudgeband-firmware
          path: |
            build/zephyr/zephyr.hex
            build/zephyr/zephyr.elf
