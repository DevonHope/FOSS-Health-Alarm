# CodeQL code scanning: looks for security bugs in the firmware (C), the Android
# app (Kotlin), the helper scripts (Python) and these workflows. Results appear
# under the repo's Security tab and as checks on each pull request.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none }
          - { language: c-cpp, build-mode: none }
          - { language: python, build-mode: none }
          # Kotlin can only be analysed while it compiles
          - { language: java-kotlin, build-mode: manual }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile the Android app
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: ./gradlew --no-daemon --no-build-cache :protocol:compileKotlin :app:compileDebugKotlin
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
