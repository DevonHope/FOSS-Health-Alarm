name: Android app

on:
  push:
    paths:
      - "android/**"
      - "docs/ble-protocol.md"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "docs/ble-protocol.md"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Unit tests (protocol and app)
        run: ./gradlew --no-daemon :protocol:test :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Show lint report
        if: always()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nudgeband-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/protocol/build/reports/
