# Keeps pinned GitHub Actions and Android libraries up to date, with security fixes first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let brand-new releases settle before adopting them
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let brand-new releases settle before adopting them
    groups:
      android:
        patterns: ["*"]
